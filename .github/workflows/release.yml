---
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: Manage releases
jobs:
  release-please:
    runs-on: [ubuntu-latest]
    steps:
      - uses: googleapis/release-please-action@05c6a4f71022304d4edad24ea90c1c16324503d5 # v17.11.2
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
