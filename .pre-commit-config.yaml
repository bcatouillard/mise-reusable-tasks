fail_fast: true

repos:
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: Check EditorConfig
        entry: editorconfig-checker
        language: system
      - id: yamllint
        name: Lint YAML
        entry: yamllint -d relaxed
        language: system
        types: [yaml]
      - id: markdownlint
        name: Lint Markdown
        entry: markdownlint-cli2
        language: system
        types: [markdown]
      - id: jactionlint
        name: Lint GitHub Actions
        entry: jactionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
